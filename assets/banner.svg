    <text x="600" y="108" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="url(#ttl)" letter-spacing="1">Node.js Core Module Handlers</text>
    <text x="600" y="60" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" fill="#5b8f66" letter-spacing="6">// TOOLKIT</text>
    
  <text x="600" y="178" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="21" fill="#9fd3a0" opacity="0">Reusable handler classes for Node.js core modules
